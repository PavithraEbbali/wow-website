<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="WOW! Authorized Dealer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06305a" />
      <stop offset="0.55" stop-color="#001a3c" />
      <stop offset="1" stop-color="#000b1b" />
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10ACE3" />
      <stop offset="0.5" stop-color="#0072A8" />
      <stop offset="1" stop-color="#F26124" />
    </linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0072A8" stop-opacity="0.8" />
      <stop offset="1" stop-color="#0072A8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F26124" stop-opacity="0.7" />
      <stop offset="1" stop-color="#F26124" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1010" cy="120" r="320" fill="url(#orb1)" />
  <circle cx="180" cy="620" r="300" fill="url(#orb2)" />

  <!-- brand mark -->
  <g transform="translate(84 86)">
    <polyline points="0,4 12,50 30,20 48,50 60,4" fill="none" stroke="url(#wm)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" />
    <text x="82" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">WOW!</text>
    <text x="82" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#F2A25A">AUTHORIZED DEALER</text>
  </g>

  <text x="84" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">Internet that makes</text>
  <text x="84" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff">you say <tspan fill="#FFC40C">WOW!</tspan></text>

  <text x="84" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#c6d6e4">No contracts · Unlimited data · Speeds up to 5 Gig fiber</text>

  <g transform="translate(84 500)">
    <rect x="0" y="0" width="250" height="60" rx="30" fill="#F26124" />
    <text x="125" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Check availability</text>
  </g>
</svg>
